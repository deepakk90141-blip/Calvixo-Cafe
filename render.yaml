services:
  - type: web
    name: calvixo-api
    runtime: python
    buildCommand: bash build.sh
    startCommand: bash start.sh
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: calvixo-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: "calvixo-api.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://calvixo-frontend.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://calvixo-frontend.onrender.com"

  - type: static_site
    name: calvixo-frontend
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://calvixo-api.onrender.com"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: calvixo-db
    plan: free